{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Gate</title>

  <style>
    :root{
      --bg1:#f6f7fb;
      --bg2:#eef2ff;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#4f46e5;
      --primaryHover:#4338ca;
      --dangerBg:#fef2f2;
      --dangerText:#991b1b;
      --shadow: 0 18px 50px rgba(17,24,39,.12);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(900px 500px at 20% 10%, var(--bg2), transparent),
                  radial-gradient(900px 500px at 80% 0%, #e0f2fe, transparent),
                  linear-gradient(180deg, var(--bg1), #fff);
      padding: 24px;
    }

    /* 🔹 상단 로고 영역 */
    .logos{
      display:flex;
      gap:16px;
      justify-content:center;
      align-items:center;
      margin-bottom: 18px;
      opacity: .95;
    }

    .logos img{
      height: 48px;
      object-fit: contain;
    }

    .card{
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      text-align: left;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom: 18px;
    }

    .badge{
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(79,70,229,.12);
      color: var(--primary);
      flex: 0 0 auto;
      margin-top: 2px;
    }

    h1{
      font-size: 22px;
      margin:0;
      letter-spacing: -0.2px;
    }

    p{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    form{
      margin-top: 18px;
      display:flex;
      gap:10px;
    }

    .input{
      flex:1;
      height: 48px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 15px;
      transition: box-shadow .15s, border-color .15s;
    }

    .input:focus{
      border-color: rgba(79,70,229,.55);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }

    .btn{
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .06s, background .15s;
      white-space: nowrap;
    }
    .btn:hover{ background: var(--primaryHover); }
    .btn:active{ transform: translateY(1px); }

    .error{
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: var(--dangerBg);
      border: 1px solid rgba(220,38,38,.18);
      color: var(--dangerText);
      font-size: 13.5px;
    }

    /* 🔹 하단 이메일 */
    .footer{
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .footer a{
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover{
      text-decoration: underline;
    }

    @media (max-width: 420px){
      .card{ padding: 20px; }
      form{ flex-direction: column; }
      .btn{ width: 100%; }
      .logos img{ height: 40px; }
    }
  </style>
</head>

<body>

  <!-- 🔹 로고 -->
  <div class="logos">
    <img src="{% static 'gate/ku_logo.png' %}" alt="고려대학교 로고">
    <img src="{% static 'gate/ku_pharm_logo.png' %}" alt="고려대학교 약학대학 로고">
  </div>

  <main class="card">
    <div class="header">
      <div class="badge" aria-hidden="true">
        🔒
      </div>
      <div>
        <h1>접근 코드 입력</h1>
        <p>승인된 사용자만 이용할 수 있습니다.</p>
      </div>
    </div>

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <input class="input" type="password" name="code" placeholder="Access Code" required autofocus />
      <button class="btn" type="submit">입장</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
