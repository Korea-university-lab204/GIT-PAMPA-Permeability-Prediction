{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Gate</title>

  <style>
    :root{
      --bg1:#f6f7fb;
      --bg2:#eef2ff;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#4f46e5;
      --primaryHover:#4338ca;
      --dangerBg:#fef2f2;
      --dangerText:#991b1b;
      --shadow: 0 18px 50px rgba(17,24,39,.12);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }

    /* ✅ 1) 화면 중앙 "고정" 대신 위쪽으로 끌어올리기 */
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items: start center; /* 🔥 center -> start center */
      background: radial-gradient(900px 500px at 20% 10%, var(--bg2), transparent),
                  radial-gradient(900px 500px at 80% 0%, #e0f2fe, transparent),
                  linear-gradient(180deg, var(--bg1), #fff);
      padding: 22px 24px 32px;   /* 위쪽 여백도 살짝 줄임 */
    }

    /* ✅ 로고+타이틀+카드를 한 묶음으로, 간격을 여기서 관리 */
    .wrap{
      width: min(720px, 100%);
      display:flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;           /* 🔥 로고-타이틀-카드 간격: 여기서 조절 */
      padding-top: 8px;    /* 더 올리고 싶으면 0으로 */
    }

    .logos img{
      object-fit: contain;
      display:block;
    }

    /* 고려대 로고 */
    .logo-main{
      height: 82px;
      max-width: 260px;
    }

    /* 약대 로고 */
    .logo-pharm{
      height: 68px;
      max-width: 220px;
    }

    /* ✅ 3) 사이트 목적(프레딕션) 타이틀 */
    .title{
      text-align:center;
      margin: 0;
      line-height: 1.2;
    }
    .title h1{
      margin:0;
      font-size: 22px;
      letter-spacing: -0.3px;
    }
    .title p{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .card{
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
      text-align: left;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom: 8px;  /* 🔥 입력창을 더 위로(요청 반영) */
    }

    .badge{
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(79,70,229,.12);
      color: var(--primary);
      flex: 0 0 auto;
      margin-top: 2px;
      font-size: 18px;
    }

    .header h2{
      font-size: 18px;
      margin:0;
      letter-spacing: -0.2px;
    }

    .header p{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
    }

    form{
      margin-top: 0;       /* 🔥 더 위로 */
      display:flex;
      gap:10px;
    }

    .input{
      flex:1;
      height: 48px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 15px;
      transition: box-shadow .15s, border-color .15s;
    }
    .input:focus{
      border-color: rgba(79,70,229,.55);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }

    .btn{
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .06s, background .15s;
      white-space: nowrap;
    }
    .btn:hover{ background: var(--primaryHover); }
    .btn:active{ transform: translateY(1px); }

    .error{
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: var(--dangerBg);
      border: 1px solid rgba(220,38,38,.18);
      color: var(--dangerText);
      font-size: 13.5px;
    }

    /* ✅ 2) Contact us 추가 */
    .footer{
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a{
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover{ text-decoration: underline; }

    @media (max-width: 420px){
      .logos img{ height: 60px; }
      .card{ padding: 20px; }
      form{ flex-direction: column; }
      .btn{ width: 100%; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- 로고 -->
    <div class="logos">
      <img class="logo-main" src="{% static 'gate/ku_logo.png' %}" alt="고려대학교 로고">
      <img class="logo-pharm" src="{% static 'gate/ku_pharm_logo.png' %}" alt="고려대학교 약학대학 로고">
    </div>

    <!-- ✅ 사이트 목적 타이틀 -->
    <div class="title">
      <h1>PAMPA Permeability Prediction</h1>
      <p>Enter the access code to continue.</p>
    </div>

    <!-- 카드 -->
    <main class="card">
      <div class="header">
        <div class="badge" aria-hidden="true">🔒</div>
        <div>
          <h2>접근 코드 입력</h2>
          <p>승인된 사용자만 이용할 수 있습니다. 접근 코드를 입력해 주세요.</p>
        </div>
      </div>

      <form method="post" autocomplete="off">
        {% csrf_token %}
        <input class="input" type="password" name="code" placeholder="Access Code" required autofocus />
        <button class="btn" type="submit">입장</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <!-- ✅ Contact us -->
      <div class="footer">
        Contact us:
        <a href="mailto:example@example.com">example@example.com</a>
      </div>
    </main>
  </div>
</body>
</html>
